name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Mypy
        run: uv run mypy src/

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      # ~320 tests (27% of the suite) self-skip with "twaky-pg not reachable"
      # when there is no database: every repository, projector and AGE test.
      # Boot the real thing through docker compose rather than a bare
      # `services:` container, so the sql/*.sh provisioning path is exercised
      # by CI too.
      - name: Provision Postgres+AGE
        run: |
          docker network create twake-network
          bash scripts/ci-env.sh
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d twaky-pg
          # Postgres serves initdb over the unix socket only, so a successful
          # TCP connect is the signal that every sql/*.sh has finished.
          for _ in $(seq 1 60); do
            if docker exec twaky-pg pg_isready -h 127.0.0.1 -U twaky -d twaky >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec twaky-pg pg_isready -h 127.0.0.1 -U twaky -d twaky \
            || (echo 'twaky-pg never finished provisioning' && docker logs twaky-pg && exit 1)

      - name: Pytest
        env:
          # Consumed by the ~44 `_reachable()` helpers across the suite, which
          # prefer TWAKY_TEST_DSN over settings.pg_dsn. Also satisfies the
          # tests/sentinels/ guard against running on a prod-shaped DSN.
          TWAKY_TEST_DSN: postgresql://twaky:ci-postgres-not-a-secret@localhost:5432/twaky
          # Code paths that read settings.pg_dsn directly resolve "twaky-pg"
          # from inside the docker network — the runner needs localhost.
          TWAKY_PG_HOST: localhost
          TWAKY_PG_PASSWORD: ci-postgres-not-a-secret
          TWAKY_OWNER_EMAIL: owner@ci.local
        run: uv run pytest -q

      - name: Postgres logs on failure
        if: failure()
        run: docker logs twaky-pg

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: OpenAPI types drift check
        run: |
          make api-types
          git diff --exit-code src/lib/api-types.d.ts \
            || (echo 'ERROR: api-types.d.ts is stale — run `make api-types` and commit.' && exit 1)

  frontend-e2e:
    if: contains(github.event.pull_request.labels.*.name, 'run-e2e') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install npm deps
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Boot the stack
        working-directory: .
        run: |
          # twake-network is declared `external: true` and every Python
          # service declares `env_file: [.env]`; without both, `docker compose
          # up` aborts before starting a single container.
          docker network create twake-network
          bash scripts/ci-env.sh
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d twaky-pg twaky-api twaky-frontend
          # Wait for twaky-frontend to be healthy (depends on twaky-api)
          for i in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' twaky-frontend 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then break; fi
            sleep 2
          done
          [ "$status" = "healthy" ] || (echo 'twaky-frontend never became healthy' && docker compose logs && exit 1)
      - name: Copy seed helper into API container
        working-directory: .
        run: docker compose cp frontend/tests/e2e/seed-awaiting-user.py twaky-api:/tmp/seed-awaiting-user.py
      - name: E2E tests
        env:
          TWAKY_TEST_STACK_URL: http://localhost:3000
          # Must match the owner scripts/ci-env.sh provisions: the fixture
          # forges a session cookie for this address and require_owner()
          # rejects anything else with a 403.
          TWAKY_OWNER_EMAIL: owner@ci.local
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
