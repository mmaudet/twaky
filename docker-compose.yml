# ─────────────────────────────────────────────────────────────────────
# Twaky — graph agentic brick, self-contained compose.
#
# Runnable standalone (from /home/mmaudet/work/twaky):
#   docker compose up -d
#
# Include-able from the platform deploy repo
# (/home/mmaudet/deploy/kickstart-maudet-cloud/docker-compose.yaml):
#   include:
#     - ../../work/twaky/docker-compose.yml
# ─────────────────────────────────────────────────────────────────────

name: twaky

x-python: &python-common
  build:
    context: .
    dockerfile: Dockerfile
  image: twaky:local
  restart: unless-stopped
  env_file: [.env]
  networks: [twake-network]

services:
  # ─────────────────────────────────────────────────────────────────
  # Dedicated Postgres+AGE. Serves BOTH the twaky graph (DB=twaky)
  # and the Langfuse metadata (DB=langfuse, provisioned by initdb).
  # No port published to host — reachable only over twake-network.
  # ─────────────────────────────────────────────────────────────────
  twaky-pg:
    image: apache/age:release_PG16_1.6.0
    container_name: twaky-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TWAKY_PG_DB:-twaky}
      POSTGRES_USER: ${TWAKY_PG_USER:-twaky}
      POSTGRES_PASSWORD: ${TWAKY_PG_PASSWORD}
      LANGFUSE_PG_USER: ${LANGFUSE_PG_USER:-langfuse}
      LANGFUSE_PG_PASSWORD: ${LANGFUSE_PG_PASSWORD}
      LANGFUSE_PG_DB: ${LANGFUSE_PG_DB:-langfuse}
    volumes:
      - twaky_pg_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TWAKY_PG_USER:-twaky} -d ${TWAKY_PG_DB:-twaky}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [twake-network]

  # ─────────────────────────────────────────────────────────────────
  # Python workers. All share the same image (Dockerfile above),
  # differentiated by the `command:` used.
  # ─────────────────────────────────────────────────────────────────
  twaky-ingest:
    <<: *python-common
    container_name: twaky-ingest
    depends_on:
      twaky-pg: { condition: service_healthy }
    command: ["twaky", "ingest"]

  twaky-projector:
    <<: *python-common
    container_name: twaky-projector
    depends_on:
      twaky-pg: { condition: service_healthy }
    command: ["twaky", "project"]

  # Interactive: not started by `docker compose up`; use
  #   docker compose run --rm twaky-agent twaky ask "..."
  twaky-agent:
    <<: *python-common
    container_name: twaky-agent
    profiles: ["ondemand"]
    depends_on:
      twaky-pg: { condition: service_healthy }
    command: ["sleep", "infinity"]

  # ─────────────────────────────────────────────────────────────────
  # Langfuse observability stack (self-hosted, MIT).
  # UI exposed via Traefik at langfuse.${BASE_DOMAIN}. No host ports.
  # ─────────────────────────────────────────────────────────────────
  twaky-clickhouse:
    image: clickhouse/clickhouse-server:26.5-alpine
    container_name: twaky-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - twaky_clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [twake-network]

  twaky-redis:
    image: redis:7-alpine
    container_name: twaky-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_AUTH}", "--appendonly", "yes"]
    volumes:
      - twaky_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_AUTH ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_AUTH: ${REDIS_AUTH}
    networks: [twake-network]

  twaky-seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: twaky-seaweedfs
    restart: unless-stopped
    command: ["server", "-s3", "-master.volumeSizeLimitMB=1024", "-dir=/data"]
    volumes:
      - twaky_seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8333/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [twake-network]

  # One-shot init: create the `langfuse` bucket on seaweedfs.
  # weed shell is the canonical way (S3 PUT /bucket returns 409 on this
  # SeaweedFS build). Uses the same seaweedfs image (already pulled).
  twaky-seaweedfs-init:
    image: chrislusf/seaweedfs:latest
    container_name: twaky-seaweedfs-init
    depends_on:
      twaky-seaweedfs: { condition: service_healthy }
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - 'echo "s3.bucket.create -name langfuse" | weed shell -master=twaky-seaweedfs:9333'
    networks: [twake-network]

  twaky-langfuse-web:
    image: langfuse/langfuse:3
    container_name: twaky-langfuse-web
    restart: unless-stopped
    depends_on:
      twaky-pg: { condition: service_healthy }
      twaky-clickhouse: { condition: service_healthy }
      twaky-redis: { condition: service_healthy }
      twaky-seaweedfs: { condition: service_healthy }
    environment: &langfuse-env
      DATABASE_URL: postgresql://${LANGFUSE_PG_USER:-langfuse}:${LANGFUSE_PG_PASSWORD}@twaky-pg:5432/${LANGFUSE_PG_DB:-langfuse}
      DIRECT_URL: postgresql://${LANGFUSE_PG_USER:-langfuse}:${LANGFUSE_PG_PASSWORD}@twaky-pg:5432/${LANGFUSE_PG_DB:-langfuse}
      NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SALT: ${SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      AUTH_DISABLE_SIGNUP: "false"
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-twaky-org}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-Twaky}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-twaky-project}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-twaky}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
      CLICKHOUSE_MIGRATION_URL: clickhouse://twaky-clickhouse:9000
      CLICKHOUSE_URL: http://twaky-clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: twaky-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_AUTH}
      LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://twaky-seaweedfs:8333
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://twaky-seaweedfs:8333
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
    healthcheck:
      # Langfuse Next.js binds to the container's own IP, not 127.0.0.1.
      test: ["CMD-SHELL", "wget -q --spider http://$$HOSTNAME:3000/api/public/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s
    labels:
      - traefik.enable=true
      - traefik.docker.network=twake-network
      - traefik.http.routers.twaky-langfuse.rule=Host(`langfuse.${BASE_DOMAIN}`)
      - traefik.http.routers.twaky-langfuse.entrypoints=websecure
      - traefik.http.routers.twaky-langfuse.tls=true
      - traefik.http.services.twaky-langfuse.loadbalancer.server.port=3000
    networks: [twake-network]

  twaky-langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: twaky-langfuse-worker
    restart: unless-stopped
    depends_on:
      twaky-langfuse-web: { condition: service_healthy }
    environment: *langfuse-env
    networks: [twake-network]

# Explicit `name:` on every volume so they resolve identically whether
# twaky is launched standalone (`docker compose up` from this dir, project
# "twaky") or via the deploy root include (project "kickstart-maudet-cloud").
# Without this, docker prefixes with the project name → different volumes.
volumes:
  twaky_pg_data:
    name: twaky_pg_data
  twaky_clickhouse_data:
    name: twaky_clickhouse_data
  twaky_redis_data:
    name: twaky_redis_data
  twaky_seaweedfs_data:
    name: twaky_seaweedfs_data

networks:
  twake-network:
    external: true
