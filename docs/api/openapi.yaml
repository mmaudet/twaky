openapi: 3.1.0
info:
  title: Twaky API
  description: HTTP + SSE surface over the Twaky mission engine.
  version: 0.1.0
paths:
  /healthz:
    get:
      tags:
      - health
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Healthz Healthz Get
  /me:
    get:
      tags:
      - me
      summary: Me
      operationId: me_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Me Me Get
  /missions:
    post:
      tags:
      - missions
      summary: Declare
      description: Declare a new mission. The daemon will pick it up via NOTIFY.
      operationId: declare_missions_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclareBody'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - missions
      summary: List Missions
      description: 'List missions for the instance owner.


        By default only live (non-terminal) missions are returned.

        Pass ``include_terminal=true`` to include done/failed/cancelled missions.'
      operationId: list_missions_missions_get
      parameters:
      - name: state
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/MissionState'
          - type: 'null'
          title: State
      - name: include_terminal
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Terminal
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Mission'
                title: Response List Missions Missions Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /missions/{mid}:
    get:
      tags:
      - missions
      summary: Get Mission
      description: Get a single mission by ID.
      operationId: get_mission_missions__mid__get
      parameters:
      - name: mid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Mid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /missions/{mid}/resume:
    post:
      tags:
      - missions
      summary: Resume Mission
      description: Resume a mission awaiting user input.
      operationId: resume_mission_missions__mid__resume_post
      parameters:
      - name: mid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Mid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeBody'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /missions/{mid}/cancel:
    post:
      tags:
      - missions
      summary: Cancel Mission
      description: Cancel a mission.
      operationId: cancel_mission_missions__mid__cancel_post
      parameters:
      - name: mid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Mid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelBody'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /missions/{mid}/trace:
    get:
      tags:
      - missions
      summary: Mission Trace
      description: Redirect to the mission's Langfuse session.
      operationId: mission_trace_missions__mid__trace_get
      parameters:
      - name: mid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Mid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /oauth/login:
    get:
      tags:
      - oauth
      summary: Login
      description: Kick off the OIDC Authorization Code + PKCE flow.
      operationId: login_oauth_login_get
      parameters:
      - name: return_to
        in: query
        required: false
        schema:
          type: string
          default: /
          title: Return To
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /oauth/callback:
    get:
      tags:
      - oauth
      summary: Callback
      description: Handle the OIDC provider's callback, set session, redirect.
      operationId: callback_oauth_callback_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /oauth/logout:
    post:
      tags:
      - oauth
      summary: Logout
      description: Purge session + redirect to LemonLDAP end-session endpoint.
      operationId: logout_oauth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /oauth/jmap/login:
    get:
      tags:
      - oauth-jmap
      summary: Jmap Login
      description: Kick off the JMAP OAuth Authorization Code + PKCE flow.
      operationId: jmap_login_oauth_jmap_login_get
      parameters:
      - name: return_to
        in: query
        required: false
        schema:
          type: string
          default: /sentinels/mail?tab=auth
          title: Return To
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /oauth/jmap/callback:
    get:
      tags:
      - oauth-jmap
      summary: Jmap Callback
      description: Handle JMAP OAuth provider callback, exchange code, store credential.
      operationId: jmap_callback_oauth_jmap_callback_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /events:
    get:
      tags:
      - events
      summary: Events
      operationId: events_events_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /agents:
    get:
      tags:
      - agents
      summary: List Agents
      operationId: list_agents_agents_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AgentSummary'
                type: array
                title: Response List Agents Agents Get
  /agents/{agent_id}:
    get:
      tags:
      - agents
      summary: Get Agent
      operationId: get_agent_agents__agent_id__get
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - agents
      summary: Patch Agent
      operationId: patch_agent_agents__agent_id__patch
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /agents/{agent_id}/default_prompt:
    get:
      tags:
      - agents
      summary: Get Default Prompt
      operationId: get_default_prompt_agents__agent_id__default_prompt_get
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultPromptResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /skills:
    get:
      tags:
      - skills
      summary: List Skills
      operationId: list_skills_skills_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SkillSummary'
                type: array
                title: Response List Skills Skills Get
    post:
      tags:
      - skills
      summary: Create Skill
      operationId: create_skill_skills_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /skills/{skill_id}:
    get:
      tags:
      - skills
      summary: Get Skill
      operationId: get_skill_skills__skill_id__get
      parameters:
      - name: skill_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Skill Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - skills
      summary: Patch Skill
      operationId: patch_skill_skills__skill_id__patch
      parameters:
      - name: skill_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Skill Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - skills
      summary: Delete Skill
      operationId: delete_skill_skills__skill_id__delete
      parameters:
      - name: skill_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Skill Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /skills/{skill_id}/test:
    post:
      tags:
      - skills
      summary: Test Skill
      operationId: test_skill_skills__skill_id__test_post
      parameters:
      - name: skill_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Skill Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillTestRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillTestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sentinels:
    get:
      tags:
      - sentinels
      summary: List Sentinels
      description: Return all sentinels with 24-hour run statistics.
      operationId: list_sentinels_sentinels_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SentinelSummary'
                type: array
                title: Response List Sentinels Sentinels Get
  /sentinels/runs/{run_id}:
    get:
      tags:
      - sentinels
      summary: Get Run Detail
      description: Return the full detail for a single sentinel run.
      operationId: get_run_detail_sentinels_runs__run_id__get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentinelRunDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sentinels/{name}:
    get:
      tags:
      - sentinels
      summary: Get Sentinel
      description: Return the full detail for a single sentinel.
      operationId: get_sentinel_sentinels__name__get
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentinelDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - sentinels
      summary: Patch Sentinel
      description: 'Toggle enabled state or update config_values for a sentinel.


        If ``config_values`` is provided, it is validated against the sentinel''s

        ``config_schema`` using JSON Schema Draft 2020-12 before persisting.

        Returns 422 with code ``validation_failed`` on schema violations.'
      operationId: patch_sentinel_sentinels__name__patch
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SentinelPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentinelDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sentinels/{name}/runs:
    get:
      tags:
      - sentinels
      summary: List Runs
      description: 'List sentinel runs, newest first.


        Accepts optional pagination parameters:

        - ``limit``: 1..500 (default 100)

        - ``before``: ISO-8601 timestamp cursor'
      operationId: list_runs_sentinels__name__runs_get
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Before
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SentinelRunSummary'
                title: Response List Runs Sentinels  Name  Runs Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /mail-sentinel/rules:
    get:
      tags:
      - mail-sentinel
      summary: List Rules
      description: 'Return all rules ordered by priority ASC.


        When ``enabled=true``, delegates to ``list_all(enabled_only=True)`` to

        filter at the DB level.  When absent or ``enabled=false``, fetches all

        rows and filters client-side so the FE can decide.'
      operationId: list_rules_mail_sentinel_rules_get
      parameters:
      - name: enabled
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabled
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MailRuleSummary'
                title: Response List Rules Mail Sentinel Rules Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - mail-sentinel
      summary: Create Rule
      description: 'Create a new mail rule with full validation.


        Returns 422 with code ``validation_failed`` on service-layer rejections.'
      operationId: create_rule_mail_sentinel_rules_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailRuleCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailRuleDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /mail-sentinel/rules/{rule_id}:
    get:
      tags:
      - mail-sentinel
      summary: Get Rule
      description: Return the full detail for a single rule.
      operationId: get_rule_mail_sentinel_rules__rule_id__get
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Rule Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailRuleDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - mail-sentinel
      summary: Patch Rule
      description: 'Apply a partial patch to a rule.


        Returns 422 with ``validation_failed`` on empty body or invalid fields.

        Returns 404 with ``mail_rule_not_found`` if the rule does not exist.'
      operationId: patch_rule_mail_sentinel_rules__rule_id__patch
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Rule Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailRulePatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailRuleDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - mail-sentinel
      summary: Delete Rule
      description: Delete a rule by id. Returns 404 if not found.
      operationId: delete_rule_mail_sentinel_rules__rule_id__delete
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Rule Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /mail-sentinel/memories:
    get:
      tags:
      - mail-sentinel
      summary: List Memories
      description: Return recently created memories, optionally filtered by scope.
      operationId: list_memories_mail_sentinel_memories_get
      parameters:
      - name: scope
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Scope
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MailMemorySummary'
                title: Response List Memories Mail Sentinel Memories Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /mail-sentinel/learned-patterns:
    get:
      tags:
      - mail-sentinel
      summary: List Learned Patterns
      description: Return all learned patterns, optionally filtered to active ones.
      operationId: list_learned_patterns_mail_sentinel_learned_patterns_get
      parameters:
      - name: active_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Active Only
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LearnedPatternSummary'
                title: Response List Learned Patterns Mail Sentinel Learned Patterns
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /mail-sentinel/learned-patterns/{sender_email}/{rule_name}:
    delete:
      tags:
      - mail-sentinel
      summary: Forget Pattern
      description: Forget a learned pattern. Silently succeeds even if the row does
        not exist.
      operationId: forget_pattern_mail_sentinel_learned_patterns__sender_email___rule_name__delete
      parameters:
      - name: sender_email
        in: path
        required: true
        schema:
          type: string
          title: Sender Email
      - name: rule_name
        in: path
        required: true
        schema:
          type: string
          title: Rule Name
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /mail-sentinel/rules/propose:
    post:
      tags:
      - mail-sentinel
      summary: Propose Rule
      description: 'Simulate a proposed rule against historical spam decisions.


        Returns a preview of how many recent decisions would have matched the

        proposed rule, which existing rules would shadow it, and up to 10 example

        rows — without persisting anything.'
      operationId: propose_rule_mail_sentinel_rules_propose_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailRuleProposeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailRuleProposeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /mail-sentinel/memories/{memory_id}:
    patch:
      tags:
      - mail-sentinel
      summary: Patch Memory
      description: Toggle a memory between permanent (persist=True) and 7-day TTL
        (persist=False).
      operationId: patch_memory_mail_sentinel_memories__memory_id__patch
      parameters:
      - name: memory_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Memory Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryPersistRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMemorySummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - mail-sentinel
      summary: Delete Memory
      description: Hard-delete a memory. Returns 404 if not found.
      operationId: delete_memory_mail_sentinel_memories__memory_id__delete
      parameters:
      - name: memory_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Memory Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /mail-sentinel/observations:
    get:
      tags:
      - mail-sentinel
      summary: List Observations
      description: Return recently recorded observations ordered by observed_at DESC.
      operationId: list_observations_mail_sentinel_observations_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObservationSummary'
                title: Response List Observations Mail Sentinel Observations Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /mail-sentinel/auth:
    get:
      tags:
      - mail-sentinel-auth
      summary: Get Auth Status
      description: 'Return the current OAuth connection status for the mail sentinel.


        Returns ``connected=false`` with all nullable fields as ``null`` when no

        credential row exists. Returns ``connected=true`` plus the stored metadata

        fields when a credential row is present (access/refresh tokens are NOT

        included in the response — only metadata).'
      operationId: get_auth_status_mail_sentinel_auth_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
    delete:
      tags:
      - mail-sentinel-auth
      summary: Delete Auth
      description: 'Delete the OAuth credential for the mail sentinel.


        Idempotent: silently succeeds if no credential row exists.

        The delete trigger fires a NOTIFY on ``oauth_credential_changed`` so the

        in-process sentinel stops polling until the owner reconnects.'
      operationId: delete_auth_mail_sentinel_auth_delete
      responses:
        '204':
          description: Successful Response
  /mail-sentinel/auth/refresh:
    post:
      tags:
      - mail-sentinel-auth
      summary: Refresh Auth
      description: 'Force an immediate token refresh and return the updated auth status.


        Returns 409 with code ``oauth_credential_not_found`` if no credential row

        exists. Returns 502 with code ``refresh_failed`` if the token endpoint

        rejects the refresh (e.g. ``invalid_grant``).'
      operationId: refresh_auth_mail_sentinel_auth_refresh_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
  /mail-sentinel/spam:
    get:
      tags:
      - mail-sentinel-spam
      summary: List Spam
      description: 'Return recent spam decisions ordered by decided_at DESC.


        Optionally filter by ``bucket`` (``spam``, ``newsletter``,

        ``phishing-alert``) and/or cursor ``before`` (ISO-8601 datetime).

        ``limit`` is bounded 1..500, defaulting to 50.


        Pass ``with_provenance=true`` to populate ``origin_mailbox_id`` and

        ``origin_mailbox_role`` fields (omitted by default for backward compat).'
      operationId: list_spam_mail_sentinel_spam_get
      parameters:
      - name: bucket
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bucket
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 50
          title: Limit
      - name: before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Before
      - name: with_provenance
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: With Provenance
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpamDecision'
                title: Response List Spam Mail Sentinel Spam Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /mail-sentinel/spam/{decision_id}/restore:
    post:
      tags:
      - mail-sentinel-spam
      summary: Restore
      description: "Restore a spam-archived email to the inbox.\n\nJMAP-first two-phase:\
        \ patches keywords on the JMAP server before touching\nthe DB, so a JMAP failure\
        \ leaves state consistent (DB not modified).\n\nError codes\n-----------\n\
        404 spam_decision_not_found\n    No decision row with the given id.\n409 already_restored\n\
        \    The decision was already restored.\n502 jmap_restore_failed\n    JMAP\
        \ server returned an error; DB was not modified."
      operationId: restore_mail_sentinel_spam__decision_id__restore_post
      parameters:
      - name: decision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Decision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpamDecision'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /mail-sentinel/spam/stats:
    get:
      tags:
      - mail-sentinel-spam
      summary: Get Stats
      description: 'Return aggregated spam decision counts for the last ``days`` days.


        Returns counts for ``spam``, ``newsletter``, ``phishing_alert``,

        ``restored``, and ``total_processed`` buckets.'
      operationId: get_stats_mail_sentinel_spam_stats_get
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 3650
          minimum: 1
          default: 30
          title: Days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpamStats'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /mail-sentinel/runs:
    get:
      tags:
      - mail-sentinel-runs
      summary: List Mail Runs
      description: 'List the N most recent mail-pipeline runs, newest first.


        Each row includes the base ``sentinel_run`` fields plus the linked

        ``mail_sentinel_spam_decision`` (bucket + signal_source) when the

        ``spam_triage`` node classified this email. Uses the ``event_ref``

        on the run (which is the JMAP email id) as the join key.'
      operationId: list_mail_runs_mail_sentinel_runs_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 50
          title: Limit
      - name: before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Before
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MailSentinelRun'
                title: Response List Mail Runs Mail Sentinel Runs Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
