[project]
name = "twaky"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michel Maudet", email = "mmaudet@linagora.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5",
    "authlib>=1.4",
    "fastapi>=0.115",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "jsonschema>=4.21",
    "langchain>=1.0",
    "langchain-community>=0.3",
    "langchain-core>=0.3",
    "langchain-litellm>=0.2",
    "langfuse>=3,<4",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "litellm>=1.75",
    "psycopg2-binary>=2.9",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "structlog>=25.1",
    "trafilatura>=1.12",
    "typer>=0.15",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
twaky = "twaky:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.ruff.format]
exclude = ["docs/superpowers/**/*.md"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring a live Postgres/RabbitMQ",
]
