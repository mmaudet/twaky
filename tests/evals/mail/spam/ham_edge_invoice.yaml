name: ham-edge-invoice

config_values:
  spam_filter_enabled: true

# FP protection: automated invoice from a known domain with valid DKIM,
# no attachment (PDF link in body only), rspamd gave "no action".
# Must reach bucket=none even though it's automated.
email:
  id: "invoice-001"
  threadId: null
  from:
    - email: "billing@invoices.saas-vendor.example.com"
  to:
    - email: "me@example.com"
  subject: "Invoice #2026-0042 from SaaS Vendor"
  preview: "Your invoice for August 2026 is ready. Amount due: €49.00. View invoice."
  receivedAt: "2026-08-10T10:00:00Z"
  keywords: {}
  headers:
    - name: "dkim-signature"
      value: "v=1; a=rsa-sha256; d=saas-vendor.example.com; s=billing; ..."
    - name: "return-path"
      value: "<billing@invoices.saas-vendor.example.com>"
    - name: "org.apache.james.rspamd.status"
      value: "action=no action; score=1.2; required_score=5.0"
  hasAttachment: false

fake_llm_outputs: {}

expected:
  bucket: "none"
  llm_called: false
  mission_emitted: false
